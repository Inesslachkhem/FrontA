<!-- Top Navbar -->
<nav
  class="navbar-scroll-shadow w-full bg-white dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700 transition-all duration-300"
  [class.scrolled]="isScrolled"
>
  <div
    class="navbar-container flex items-center justify-between px-4 sm:px-6 py-3"
  >
    <!-- Left Side - Mobile Menu Toggle & Page Title -->
    <div class="flex items-center space-x-3"></div>

    <div class="flex items-center space-x-1 sm:space-x-2 lg:space-x-4">
      <!-- Search Bar (Hidden on small screens) -->
      <div class="hidden lg:block">
        <div class="relative">
          <div
            class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"
          >
            <i class="fas fa-search text-gray-400"></i>
          </div>
          <input
            type="text"
            placeholder="Search..."
            class="bg-gray-50 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 text-gray-900 dark:text-white text-sm rounded-lg focus:ring-primary-500 focus:border-primary-500 block w-48 xl:w-64 pl-10 p-2.5"
          />
        </div>
      </div>

      <!-- Mobile Search Button -->
      <button
        (click)="toggleMobileSearch()"
        class="navbar-button lg:hidden p-2 text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-lg transition-colors duration-200"
        [class.bg-gray-100]="isMobileSearchOpen"
        [class.dark:bg-gray-700]="isMobileSearchOpen"
        title="Search"
      >
        <i
          class="fas fa-search text-lg transition-transform duration-200"
          [class.rotate-90]="isMobileSearchOpen"
        ></i>
      </button>

      <!-- Theme Toggle -->
      <button
        (click)="toggleTheme()"
        class="navbar-button p-2 text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-lg transition-colors duration-200 flex-shrink-0"
        title="Toggle theme"
      >
        <i class="theme-toggle-icon fas fa-sun text-lg" *ngIf="isDarkMode"></i>
        <i
          class="theme-toggle-icon fas fa-moon text-lg"
          *ngIf="!isDarkMode"
        ></i>
      </button>

      <!-- Notifications -->
      <div class="relative">
        <button
          (click)="toggleNotifications()"
          class="navbar-button relative p-2 text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-lg transition-colors duration-200"
          title="Notifications"
        >
          <i class="fas fa-bell text-lg"></i>
          <span
            *ngIf="unreadCount > 0"
            class="notification-badge absolute -top-1 -right-1 bg-red-500 text-white text-xs rounded-full h-5 w-5 flex items-center justify-center"
          >
            {{ unreadCount }}
          </span>
        </button>

        <!-- Notifications Dropdown -->
        <div
          *ngIf="isNotificationOpen"
          class="dropdown-menu absolute right-0 mt-2 w-80 bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl shadow-lg z-50"
        >
          <div class="p-4 border-b border-gray-200 dark:border-gray-700">
            <h3 class="text-lg font-semibold text-gray-900 dark:text-white">
              Notifications
            </h3>
          </div>
          <div class="max-h-96 overflow-y-auto">
            <div
              *ngFor="let notification of notifications"
              (click)="markAsRead(notification.id)"
              class="p-4 border-b border-gray-100 dark:border-gray-600 hover:bg-gray-50 dark:hover:bg-gray-700 cursor-pointer transition-colors duration-200"
            >
              <div class="flex items-start space-x-3">
                <div
                  class="w-2 h-2 bg-blue-500 dark:bg-blue-400 rounded-full mt-2"
                  *ngIf="notification.unread"
                ></div>
                <div class="flex-1">
                  <p class="text-sm font-medium text-gray-900 dark:text-white">
                    {{ notification.title }}
                  </p>
                  <p class="text-sm text-gray-600 dark:text-gray-400 mt-1">
                    {{ notification.message }}
                  </p>
                  <p class="text-xs text-gray-500 dark:text-gray-400 mt-2">
                    {{ notification.time }}
                  </p>
                </div>
              </div>
            </div>
          </div>
          <div
            class="p-4 text-center border-t border-gray-200 dark:border-gray-700"
          >
            <a
              href="#"
              class="text-sm text-blue-600 dark:text-blue-400 hover:text-blue-800 dark:hover:text-blue-300 transition-colors duration-200"
            >
              View all notifications
            </a>
          </div>
        </div>
      </div>
      <!-- Profile Dropdown -->
      <div class="relative">
        <button
          (click)="toggleProfile()"
          class="navbar-button flex items-center space-x-2 p-2 text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700 rounded-lg transition-colors duration-200"
        >
          <div
            class="profile-avatar w-8 h-8 bg-primary-600 rounded-full flex items-center justify-center"
          >
            <span class="text-white text-sm font-semibold" *ngIf="currentUser">
              {{ currentUser.prenom.charAt(0) }}{{ currentUser.nom.charAt(0) }}
            </span>
            <i class="fas fa-user text-white text-sm" *ngIf="!currentUser"></i>
          </div>
          <div class="hidden md:block text-left" *ngIf="currentUser">
            <p class="text-sm font-medium text-gray-800 dark:text-white">
              {{ currentUser.prenom }} {{ currentUser.nom }}
            </p>
            <p class="text-xs text-gray-500 dark:text-gray-400">
              {{ getUserTypeDisplay() }}
            </p>
          </div>
          <i
            class="fas fa-chevron-down text-xs transition-transform duration-200"
            [class.rotate-180]="isProfileOpen"
          ></i>
        </button>

        <!-- Profile Dropdown Menu -->
        <div
          *ngIf="isProfileOpen"
          class="dropdown-menu absolute right-0 mt-2 w-48 bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl shadow-lg z-50"
        >
          <div
            class="p-4 border-b border-gray-200 dark:border-gray-700"
            *ngIf="currentUser"
          >
            <p class="text-sm font-medium text-gray-900 dark:text-white">
              {{ currentUser.prenom }} {{ currentUser.nom }}
            </p>
            <p class="text-xs text-gray-500 dark:text-gray-400">
              {{ currentUser.email }}
            </p>
          </div>
          <div class="py-2">
            <button
              (click)="goToProfile()"
              class="w-full text-left flex items-center px-4 py-2 text-sm text-gray-700 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors duration-200"
            >
              <i class="fas fa-user-cog mr-3"></i>
              Mon Profil
            </button>
            <a
              routerLink="/users"
              *ngIf="currentUser?.type === 0"
              class="flex items-center px-4 py-2 text-sm text-gray-700 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors duration-200"
              (click)="isProfileOpen = false"
            >
              <i class="fas fa-users mr-3"></i>
              Gestion des Utilisateurs
            </a>
            <a
              href="#"
              class="flex items-center px-4 py-2 text-sm text-gray-700 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors duration-200"
            >
              <i class="fas fa-cog mr-3"></i>
              Préférences
            </a>
            <a
              href="#"
              class="flex items-center px-4 py-2 text-sm text-gray-700 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors duration-200"
            >
              <i class="fas fa-question-circle mr-3"></i>
              Aide & Support
            </a>
            <hr class="my-2 border-gray-200 dark:border-gray-600" />
            <button
              (click)="logout()"
              class="w-full text-left flex items-center px-4 py-2 text-sm text-red-600 dark:text-red-400 hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors duration-200"
            >
              <i class="fas fa-sign-out-alt mr-3"></i>
              Se déconnecter
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Mobile Search Bar (Collapsible) -->
  <div
    *ngIf="isMobileSearchOpen"
    class="mobile-search-container lg:hidden border-t border-gray-200 dark:border-gray-700 px-4 py-3"
  >
    <div class="relative">
      <div
        class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"
      >
        <i class="fas fa-search text-gray-400"></i>
      </div>
      <input
        id="mobileSearchInput"
        type="text"
        placeholder="Search..."
        class="search-input bg-gray-50 dark:bg-gray-700 border border-gray-300 dark:border-gray-600 text-gray-900 dark:text-white text-sm rounded-lg focus:ring-primary-500 focus:border-primary-500 block w-full pl-10 p-2.5"
        (keydown.escape)="closeMobileSearch()"
        #mobileSearchInput
      />
      <button
        (click)="closeMobileSearch()"
        class="navbar-button absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-gray-600 dark:hover:text-gray-300"
      >
        <i
          class="fas fa-times transition-transform duration-200 hover:rotate-90"
        ></i>
      </button>
    </div>
  </div>
</nav>
